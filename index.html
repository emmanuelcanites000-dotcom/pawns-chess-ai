<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>The Pawns Game - Stockfish AI</title>

<style>
:root{
    --bg:#0d0f12;
    --panel:#161a20;
    --light:#b8c5cf;
    --dark:#26313a;
    --accent:#4ec899;
    --danger:#ff5e6c;
    --text:#f3f4f6;
    --muted:#9aa5b1;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top,#172027 0%,#0d0f12 55%);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    padding:12px;
}

.game{
    width:100%;
    max-width:650px;
}

h1{
    text-align:center;
    font-size:1.65rem;
    margin:8px 0 12px;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    font-size:.85rem;
    margin-bottom:12px;
}

/* CLOCKS */

.clocks{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px;
}

.clock{
    background:var(--panel);
    border:2px solid #303841;
    border-radius:12px;
    padding:10px;
    text-align:center;
}

.clock.active{
    border-color:var(--accent);
    box-shadow:0 0 15px rgba(78,200,153,.18);
}

.clock-label{
    font-size:.75rem;
    color:var(--muted);
    margin-bottom:4px;
}

.clock-time{
    font-size:1.7rem;
    font-weight:bold;
    font-variant-numeric:tabular-nums;
}

.clock.active .clock-time{
    color:var(--accent);
}

/* BOARD */

.board-wrap{
    width:100%;
    max-width:600px;
    margin:auto;
    aspect-ratio:1/1;
    position:relative;
}

.board{
    width:100%;
    height:100%;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    border:4px solid #11151a;
    border-radius:8px;
    overflow:hidden;
    box-shadow:
        0 12px 35px rgba(0,0,0,.45),
        0 0 0 1px #39424a;
}

.square{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
}

.light{
    background:var(--light);
}

.dark{
    background:var(--dark);
}

.square.selected{
    box-shadow:
        inset 0 0 0 5px rgba(255,215,80,.75);
}

.square.last-move{
    box-shadow:
        inset 0 0 0 4px rgba(78,200,153,.55);
}

.square.legal::after{
    content:"";
    width:20%;
    height:20%;
    border-radius:50%;
    background:rgba(0,0,0,.28);
    position:absolute;
}

.square.capture::after{
    content:"";
    width:72%;
    height:72%;
    border-radius:50%;
    border:4px solid rgba(255,90,105,.75);
    position:absolute;
}

.pawn{
    font-size:clamp(2rem,9vw,4.1rem);
    line-height:1;
    position:relative;
    z-index:2;
    transition:transform .1s ease;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.4));
}

.pawn.white{
    color:#ffffff;
    text-shadow:
        0 1px 0 #aaa,
        0 2px 4px rgba(0,0,0,.55);
}

.pawn.black{
    color:#11151a;
    text-shadow:
        0 1px 0 #777,
        0 2px 4px rgba(0,0,0,.65);
}

.coordinates{
    position:absolute;
    font-size:.58rem;
    font-weight:bold;
    opacity:.75;
    pointer-events:none;
}

.file{
    bottom:2px;
    right:4px;
}

.rank{
    top:2px;
    left:4px;
}

/* STATUS */

.status{
    margin-top:10px;
    background:var(--panel);
    border:1px solid #303841;
    border-radius:10px;
    padding:10px;
    text-align:center;
    min-height:42px;
}

.status.ok{
    color:var(--accent);
}

.status.thinking{
    color:#ffd75a;
}

.status.error{
    color:var(--danger);
}

/* CONTROLS */

.controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-top:10px;
}

button{
    border:0;
    border-radius:9px;
    padding:10px 14px;
    font-weight:bold;
    color:white;
    background:#303941;
    cursor:pointer;
    touch-action:manipulation;
}

button:active{
    transform:scale(.97);
}

button.primary{
    background:linear-gradient(135deg,#35a978,#4ec899);
}

button.danger{
    background:#b63c4a;
}

/* HISTORY */

.history{
    margin-top:12px;
    background:var(--panel);
    border:1px solid #303841;
    border-radius:10px;
    padding:12px;
}

.history h2{
    text-align:center;
    font-size:1rem;
    margin-bottom:8px;
}

.moves{
    max-height:150px;
    overflow-y:auto;
    font-family:monospace;
    font-size:.82rem;
}

.move-row{
    display:grid;
    grid-template-columns:42px 1fr 1fr;
    gap:6px;
    padding:5px 4px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.move-number{
    color:var(--muted);
}

.white-move{
    color:#fff;
}

.black-move{
    color:#aaa;
}

/* AI INFO */

.ai-info{
    margin-top:10px;
    background:#11151a;
    border:1px solid #303841;
    border-radius:10px;
    padding:9px;
    font-size:.75rem;
    color:var(--muted);
    text-align:center;
}

.ai-info span{
    color:var(--accent);
}

/* RESPONSIVE */

@media(max-width:430px){
    body{
        padding:7px;
    }

    h1{
        font-size:1.35rem;
    }

    .clock-time{
        font-size:1.45rem;
    }

    .pawn{
        font-size:clamp(1.8rem,10vw,3rem);
    }

    button{
        padding:9px 11px;
        font-size:.8rem;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>♟ The Pawns Game</h1>

    <div class="subtitle">
        8 Pawns vs 8 Pawns • Stockfish AI • 3:00 + 10
    </div>

    <div class="clocks">

        <div class="clock active" id="whiteClockBox">
            <div class="clock-label">WHITE</div>
            <div class="clock-time" id="whiteTime">
                3:00
            </div>
        </div>

        <div class="clock" id="blackClockBox">
            <div class="clock-label">BLACK / AI</div>
            <div class="clock-time" id="blackTime">
                3:00
            </div>
        </div>

    </div>

    <div class="board-wrap">
        <div id="board" class="board"></div>
    </div>

    <div id="status" class="status ok">
        Your turn — move a white pawn
    </div>

    <div class="controls">
        <button class="primary" id="newGameBtn">
            New Game
        </button>

        <button id="undoBtn">
            Undo
        </button>

        <button id="soundBtn">
            🔊 Sound ON
        </button>
    </div>

    <div class="history">
        <h2>Move History</h2>

        <div id="moves" class="moves">
            <div style="text-align:center;color:#777">
                No moves yet
            </div>
        </div>
    </div>

    <div class="ai-info">
        Engine:
        <span>Stockfish 18 Lite</span>
        • Time control:
        <span>3+10</span>
    </div>

</div>

<script>
/* =========================================================
   THE PAWNS GAME
   STOCKFISH 18 LITE
   3 MINUTES + 10 SECOND INCREMENT
   ========================================================= */

const BOARD_SIZE = 8;

const START_TIME = 180;
const INCREMENT = 10;

const STOCKFISH_JS =
    "stockfish-18-lite-single (1).js";

const boardEl =
    document.getElementById("board");

const statusEl =
    document.getElementById("status");

const movesEl =
    document.getElementById("moves");

const whiteTimeEl =
    document.getElementById("whiteTime");

const blackTimeEl =
    document.getElementById("blackTime");

const whiteClockBox =
    document.getElementById("whiteClockBox");

const blackClockBox =
    document.getElementById("blackClockBox");

const newGameBtn =
    document.getElementById("newGameBtn");

const undoBtn =
    document.getElementById("undoBtn");

const soundBtn =
    document.getElementById("soundBtn");


/* =========================================================
   GAME STATE
   ========================================================= */

let board = [];

let selected = null;

let turn = "w";

let gameOver = false;

let thinking = false;

let soundEnabled = true;

let whiteTime = START_TIME;

let blackTime = START_TIME;

let timerInterval = null;

let lastMove = null;

let moveHistory = [];

let snapshots = [];


/* =========================================================
   STOCKFISH
   ========================================================= */

let engine = null;

let engineReady = false;

let engineSearch = false;


/* =========================================================
   INITIAL BOARD
   ========================================================= */

function createStartingBoard(){

    board = Array.from(
        {length: BOARD_SIZE},
        () => Array(BOARD_SIZE).fill(null)
    );

    /*
       Black pawns
       rank 7 in chess = row 1
    */

    for(let col = 0; col < 8; col++){
        board[1][col] = "b";
    }

    /*
       White pawns
       rank 2 in chess = row 6
    */

    for(let col = 0; col < 8; col++){
        board[6][col] = "w";
    }
}


/* =========================================================
   DRAW BOARD
   ========================================================= */

function drawBoard(){

    boardEl.innerHTML = "";

    for(let row = 0; row < 8; row++){

        for(let col = 0; col < 8; col++){

            const square =
                document.createElement("div");

            square.className =
                "square " +
                ((row + col) % 2 === 0
                    ? "light"
                    : "dark");

            square.dataset.row = row;
            square.dataset.col = col;

            if(
                selected &&
                selected.row === row &&
                selected.col === col
            ){
                square.classList.add("selected");
            }

            if(
                lastMove &&
                (
                    (
                        lastMove.from.row === row &&
                        lastMove.from.col === col
                    ) ||
                    (
                        lastMove.to.row === row &&
                        lastMove.to.col === col
                    )
                )
            ){
                square.classList.add("last-move");
            }

            if(
                selected &&
                isLegalPlayerMove(
                    selected.row,
                    selected.col,
                    row,
                    col
                )
            ){

                if(board[row][col]){
                    square.classList.add("capture");
                }else{
                    square.classList.add("legal");
                }
            }


            const piece = board[row][col];

            if(piece){

                const pawn =
                    document.createElement("div");

                pawn.className =
                    "pawn " +
                    (piece === "w"
                        ? "white"
                        : "black");

                pawn.textContent = "♟";

                square.appendChild(pawn);
            }


            /*
              Chess-style coordinates
            */

            if(row === 7){

                const file =
                    document.createElement("span");

                file.className =
                    "coordinates file";

                file.textContent =
                    String.fromCharCode(97 + col);

                square.appendChild(file);
            }

            if(col === 0){

                const rank =
                    document.createElement("span");

                rank.className =
                    "coordinates rank";

                rank.textContent =
                    8 - row;

                square.appendChild(rank);
            }


            square.addEventListener(
                "click",
                handleSquareClick
            );

            boardEl.appendChild(square);
        }
    }
}


/* =========================================================
   PLAYER CLICK
   ========================================================= */

function handleSquareClick(event){

    if(gameOver) return;

    if(thinking) return;

    if(turn !== "w") return;

    const square =
        event.currentTarget;

    const row =
        Number(square.dataset.row);

    const col =
        Number(square.dataset.col);


    /*
       Selecting a white pawn
    */

    if(
        board[row][col] === "w"
    ){

        selected = {
            row,
            col
        };

        playSelectSound();

        drawBoard();

        return;
    }


    /*
       Move selected pawn
    */

    if(selected){

        if(
            isLegalPlayerMove(
                selected.row,
                selected.col,
                row,
                col
            )
        ){

            makePlayerMove(
                selected.row,
                selected.col,
                row,
                col
            );

            return;
        }

        playIllegalSound();

        setStatus(
            "Illegal pawn move",
            "error"
        );
    }
}


/* =========================================================
   PAWN MOVEMENT
   ========================================================= */

function isLegalPlayerMove(
    fromRow,
    fromCol,
    toRow,
    toCol
){

    if(
        fromRow < 0 ||
        fromRow > 7 ||
        fromCol < 0 ||
        fromCol > 7 ||
        toRow < 0 ||
        toRow > 7 ||
        toCol < 0 ||
        toCol > 7
    ){
        return false;
    }

    if(board[fromRow][fromCol] !== "w"){
        return false;
    }

    /*
       White moves upward:
       row decreases
    */

    const direction = -1;

    const oneStep =
        fromRow + direction;

    /*
       Normal move
    */

    if(
        toCol === fromCol &&
        toRow === oneStep &&
        board[toRow][toCol] === null
    ){
        return true;
    }

    /*
       Initial two-square move
    */

    if(
        fromRow === 6 &&
        toCol === fromCol &&
        toRow === 4 &&
        board[5][fromCol] === null &&
        board[4][fromCol] === null
    ){
        return true;
    }

    /*
       Diagonal capture
    */

    if(
        toRow === oneStep &&
        Math.abs(toCol - fromCol) === 1 &&
        board[toRow][toCol] === "b"
    ){
        return true;
    }

    return false;
}


/* =========================================================
   AI PAWN MOVEMENT
   ========================================================= */

function isLegalBlackMove(
    fromRow,
    fromCol,
    toRow,
    toCol
){

    if(board[fromRow][fromCol] !== "b"){
        return false;
    }

    /*
       Black moves downward
    */

    const direction = 1;

    const oneStep =
        fromRow + direction;

    /*
       Forward move
    */

    if(
        toCol === fromCol &&
        toRow === oneStep &&
        board[toRow][toCol] === null
    ){
        return true;
    }

    /*
       Initial two-square move
    */

    if(
        fromRow === 1 &&
        toCol === fromCol &&
        toRow === 3 &&
        board[2][fromCol] === null &&
        board[3][fromCol] === null
    ){
        return true;
    }

    /*
       Capture
    */

    if(
        toRow === oneStep &&
        Math.abs(toCol - fromCol) === 1 &&
        board[toRow][toCol] === "w"
    ){
        return true;
    }

    return false;
}


/* =========================================================
   PLAYER MOVE
   ========================================================= */

function makePlayerMove(
    fromRow,
    fromCol,
    toRow,
    toCol
){

    saveSnapshot();

    const captured =
        board[toRow][toCol];

    board[toRow][toCol] =
        board[fromRow][fromCol];

    board[fromRow][fromCol] =
        null;

    selected = null;

    lastMove = {
        from:{
            row:fromRow,
            col:fromCol
        },
        to:{
            row:toRow,
            col:toCol
        }
    };


    const notation =
        createNotation(
            "w",
            fromRow,
            fromCol,
            toRow,
            toCol,
            captured
        );

    moveHistory.push({
        color:"w",
        notation
    });


    playMoveSound(captured);

    addIncrement("w");

    turn = "b";

    drawBoard();

    updateHistory();

    checkGameState();

    if(!gameOver){

        setStatus(
            "Stockfish is thinking...",
            "thinking"
        );

        thinking = true;

        requestAIMove();
    }
}


/* =========================================================
   END OF PART 1
   ========================================================= */
